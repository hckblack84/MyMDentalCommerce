services:
  app_mym_dental:
    build: MyMDentistComerce
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      AWS_BUCKET_NAME: name
      PUBLIC_KEY: a
      SECRET_KEY: b
      TOKEN_KEY: c
      DB_PATH: d
      DB_USER: e
      DB_PASS: f
      LOCAL_PATH: http://localhost:5173
      CLOUDFRONT_PATH: https://dqu1zpx4zovo4.cloudfront.net
      S3_BUCKET_PAGE: arn:aws:s3:::lanzamientowebdemo
    restart: always
    depends_on:
      mym_dental:
        condition: service_healthy
  mym_dental:
    image: mysql:8.0.33
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_PASSWORD: 1234
      MYSQL_DATABASE: mym_dental_commerce
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
